<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Porsche 911 — Infinite City Drive</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;font-family:'Segoe UI',Arial,sans-serif;touch-action:none}
  canvas{display:block}

  /* ── Loading ── */
  #loading{position:fixed;inset:0;background:#0a0a0f;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:50;color:#fff}
  #loading h1{font-size:clamp(22px,5vw,44px);color:#e8c840;letter-spacing:6px;margin-bottom:18px}
  #loading p{color:#888;font-size:13px;margin-bottom:24px;letter-spacing:1px}
  #bar-wrap{width:260px;height:6px;background:#222;border-radius:4px;overflow:hidden}
  #bar{height:100%;background:linear-gradient(90deg,#e8c840,#ff8c00);width:0%;transition:width .3s}

  /* ── HUD ── */
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:14px 18px;pointer-events:none;z-index:10}
  .hb{background:rgba(0,0,0,.78);border:1px solid rgba(232,200,64,.35);
    border-radius:8px;padding:7px 14px;color:#fff}
  .hl{font-size:9px;color:#e8c840;letter-spacing:2px;text-transform:uppercase}
  .hv{font-size:26px;font-weight:700;line-height:1.1}
  .hs{font-size:11px;color:#888}

  /* ── Speedo arc ── */
  #speedo{position:fixed;bottom:20px;right:20px;width:110px;height:110px;z-index:10;pointer-events:none}

  /* ── Touch controls ── */
  #tc{position:fixed;bottom:0;left:0;right:0;height:160px;z-index:10;
    display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px 22px}
  .tb{width:68px;height:68px;border-radius:50%;
    background:rgba(232,200,64,.14);border:2px solid rgba(232,200,64,.5);
    display:flex;align-items:center;justify-content:center;
    pointer-events:all;user-select:none;touch-action:none;transition:background .1s}
  .tb:active,.tb.on{background:rgba(232,200,64,.42)}
  .row{display:flex;gap:10px}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px}
  #tb-nitro{width:74px;height:74px;border-radius:50%;
    background:rgba(255,80,0,.16);border:2px solid rgba(255,120,0,.65);
    display:flex;align-items:center;justify-content:center;
    pointer-events:all;user-select:none;touch-action:none;
    box-shadow:0 0 12px rgba(255,80,0,.4)}
  #tb-nitro:active,#tb-nitro.on{background:rgba(255,80,0,.5);box-shadow:0 0 26px rgba(255,80,0,.9)}

  /* ── Nitro flash ── */
  #nitro-flash{position:fixed;inset:0;pointer-events:none;z-index:8;
    background:radial-gradient(ellipse at center,rgba(255,120,0,.0) 60%,rgba(255,80,0,.55) 100%);
    opacity:0;transition:opacity .15s}

  /* ── Damage bar ── */
  #dmg-wrap{position:fixed;bottom:20px;left:20px;width:140px;z-index:10;pointer-events:none}
  #dmg-label{font-size:9px;color:#e8c840;letter-spacing:2px;margin-bottom:4px}
  #dmg-track{background:#222;border-radius:4px;height:8px;overflow:hidden;border:1px solid #333}
  #dmg-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#22cc44,#e8c840,#ff3300);
    width:100%;transition:width .3s}

  /* ── Rotate reminder ── */
  #rotate{display:none;position:fixed;inset:0;z-index:99;background:#000;color:#e8c840;
    flex-direction:column;align-items:center;justify-content:center;font-size:20px;gap:12px}
  @media(orientation:landscape)and(max-height:450px){#rotate{display:flex}}
</style>
</head>
<body>

<div id="rotate">📱 Rotate to Portrait</div>

<div id="loading">
  <h1>PORSCHE 911</h1>
  <p>LOADING ASSETS…</p>
  <div id="bar-wrap"><div id="bar"></div></div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hb">
    <div class="hl">Speed</div>
    <div class="hv" id="h-spd">0 <span style="font-size:13px;color:#888">km/h</span></div>
  </div>
  <div class="hb" style="text-align:center">
    <div class="hl">Distance</div>
    <div class="hv" id="h-dist">0 m</div>
    <div class="hs" id="h-nitro">NITRO READY 🚀</div>
  </div>
  <div class="hb" style="text-align:right">
    <div class="hl">Gear</div>
    <div class="hv" id="h-gear">N</div>
  </div>
</div>

<!-- Speedometer canvas -->
<canvas id="speedo" width="110" height="110"></canvas>

<!-- Damage bar -->
<div id="dmg-wrap">
  <div id="dmg-label">BODY HEALTH</div>
  <div id="dmg-track"><div id="dmg-fill"></div></div>
</div>

<!-- Nitro vignette flash -->
<div id="nitro-flash"></div>

<!-- Touch controls -->
<div id="tc">
  <div class="row">
    <div class="tb" id="tb-left">
      <svg width="26" height="26" viewBox="0 0 26 26"><path d="M17 5L7 13L17 21" stroke="#e8c840" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>
    </div>
    <div class="tb" id="tb-right">
      <svg width="26" height="26" viewBox="0 0 26 26"><path d="M9 5L19 13L9 21" stroke="#e8c840" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>
    </div>
  </div>
  <div class="col">
    <div class="tb" id="tb-accel">
      <svg width="26" height="26" viewBox="0 0 26 26"><path d="M5 19L13 7L21 19" stroke="#e8c840" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>
    </div>
    <!-- Rocket SVG nitro -->
    <div id="tb-nitro">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
        <ellipse cx="22" cy="17" rx="6.5" ry="11" fill="#ff4400"/>
        <path d="M22 5L29 15L15 15Z" fill="#ff6600"/>
        <circle cx="22" cy="17" r="3.2" fill="#88ccff" opacity=".9"/>
        <circle cx="22" cy="17" r="1.6" fill="#fff" opacity=".5"/>
        <path d="M15.5 25L12 33L19 28Z" fill="#cc2200"/>
        <path d="M28.5 25L32 33L25 28Z" fill="#cc2200"/>
        <ellipse cx="22" cy="30" rx="4" ry="5.5" fill="#ffc200" opacity=".9"/>
        <ellipse cx="22" cy="32" rx="2.5" ry="3.5" fill="#fff" opacity=".7"/>
        <text x="22" y="42" text-anchor="middle" font-size="6" font-weight="bold" fill="#ffc200" font-family="Arial">NOS</text>
      </svg>
    </div>
    <div class="tb" id="tb-brake">
      <svg width="26" height="26" viewBox="0 0 26 26"><path d="M5 7L13 19L21 7" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

// ── GLTFLoader inline (r128 compatible) ─────────────────────────────────────
// We load it from CDN unpkg since three r128 jsm isn't on cdnjs
const { GLTFLoader } = await import('https://unpkg.com/three@0.128.0/examples/jsm/loaders/GLTFLoader.js');
const { DRACOLoader } = await import('https://unpkg.com/three@0.128.0/examples/jsm/loaders/DRACOLoader.js');

// ── Progress bar helper ──────────────────────────────────────────────────────
const bar = document.getElementById('bar');
function setProgress(p){ bar.style.width = (p*100)+'%'; }

// ── Renderer ─────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60,1,0.1,1200);

function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

// ── Sky & Sun ─────────────────────────────────────────────────────────────────
// Procedural gradient sky
const skyGeo = new THREE.SphereGeometry(600,32,16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {
    topColor:    { value: new THREE.Color(0x0a0520) },
    midColor:    { value: new THREE.Color(0x1a0a3a) },
    horizColor:  { value: new THREE.Color(0xff6030) },
    sunColor:    { value: new THREE.Color(0xffe080) },
    sunDir:      { value: new THREE.Vector3(0.4,0.18,-1).normalize() },
  },
  vertexShader:`
    varying vec3 vDir;
    void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
  `,
  fragmentShader:`
    uniform vec3 topColor,midColor,horizColor,sunColor,sunDir;
    varying vec3 vDir;
    void main(){
      vec3 d=normalize(vDir);
      float h=d.y;
      // sky gradient
      vec3 col=mix(horizColor,midColor,smoothstep(-0.05,0.3,h));
      col=mix(col,topColor,smoothstep(0.2,0.9,h));
      // sun
      float sun=pow(max(dot(d,sunDir),0.0),180.0);
      float glow=pow(max(dot(d,sunDir),0.0),8.0)*0.4;
      col+=sunColor*sun;
      col+=vec3(1.0,0.5,0.1)*glow;
      gl_FragColor=vec4(col,1.0);
    }
  `
});
scene.add(new THREE.Mesh(skyGeo,skyMat));

// Stars
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(3000);
for(let i=0;i<3000;i+=3){
  const theta=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1);
  const r=580+Math.random()*10;
  starPos[i]  =r*Math.sin(phi)*Math.cos(theta);
  starPos[i+1]=r*Math.cos(phi);
  starPos[i+2]=r*Math.sin(phi)*Math.sin(theta);
}
starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:0.8,sizeAttenuation:true})));

// Sun disc mesh
const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(6,16,16),
  new THREE.MeshBasicMaterial({color:0xffe060})
);
const SUN_DIR = new THREE.Vector3(0.4,0.18,-1).normalize();
sunMesh.position.copy(SUN_DIR).multiplyScalar(500);
scene.add(sunMesh);

// ── Lighting ─────────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x334466,0.8);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffe8c0,1.4);
sun.position.set(80,80,-120);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1; sun.shadow.camera.far=400;
sun.shadow.camera.left=-120; sun.shadow.camera.right=120;
sun.shadow.camera.top=60; sun.shadow.camera.bottom=-60;
scene.add(sun);

// Street lights (placed per road segment in road loop)
function makeStreetLight(x,y,z){
  const g=new THREE.Group();
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.15,.2,8,6),
    new THREE.MeshLambertMaterial({color:0x555566}));
  pole.position.y=4; g.add(pole);
  const head=new THREE.Mesh(new THREE.BoxGeometry(2,.3,.8),
    new THREE.MeshBasicMaterial({color:0xffeeaa}));
  head.position.set(0.8,8.1,0); g.add(head);
  const pl=new THREE.PointLight(0xffcc66,1.2,22);
  pl.position.set(0.8,8.2,0); g.add(pl);
  g.position.set(x,y,z);
  scene.add(g);
}

// ── Road pool (4 segments, looping) ─────────────────────────────────────────
const ROAD_LENGTH = 60;   // unit length of one road chunk in world-Z
const ROAD_COUNT  = 4;    // how many we keep alive
const roadPool    = [];
let   cityTemplate= null; // the loaded city GLB scene

// Ground plane (infinite feel)
const groundMat = new THREE.MeshLambertMaterial({color:0x111118});
const groundGeo = new THREE.PlaneGeometry(300,2000);
const groundMesh= new THREE.Mesh(groundGeo,groundMat);
groundMesh.rotation.x=-Math.PI/2;
groundMesh.position.set(0,-.02,-500);
groundMesh.receiveShadow=true;
scene.add(groundMesh);

// Road asphalt strip
const roadSurfMat = new THREE.MeshLambertMaterial({color:0x1a1a22});
for(let i=0;i<ROAD_COUNT;i++){
  const surf=new THREE.Mesh(new THREE.PlaneGeometry(14,ROAD_LENGTH),roadSurfMat.clone());
  surf.rotation.x=-Math.PI/2;
  surf.receiveShadow=true;
  scene.add(surf);
  roadPool.push({surf, cityClone:null, z:0});
}

// Road markings helper
function makeRoadMarkings(z){
  const g=new THREE.Group();
  const dashMat=new THREE.MeshBasicMaterial({color:0xffffff,opacity:.6,transparent:true});
  for(let d=0;d<6;d++){
    const dm=new THREE.Mesh(new THREE.PlaneGeometry(.3,4),dashMat);
    dm.rotation.x=-Math.PI/2;
    dm.position.set(0,.01,z-d*(ROAD_LENGTH/6));
    g.add(dm);
  }
  // kerbs
  const kerbMat=new THREE.MeshLambertMaterial({color:0xff2222});
  [-7,7].forEach(x=>{
    const km=new THREE.Mesh(new THREE.BoxGeometry(.4,.25,ROAD_LENGTH),kerbMat);
    km.position.set(x,.12,z);
    g.add(km);
  });
  scene.add(g);
  return g;
}
const markingPool=[];
for(let i=0;i<ROAD_COUNT;i++) markingPool.push(null);

function placeRoadSegment(slot,zPos){
  // position road surface
  roadPool[slot].surf.position.set(0,0,zPos);
  roadPool[slot].z=zPos;

  // place city clone
  if(cityTemplate && !roadPool[slot].cityClone){
    roadPool[slot].cityClone = cityTemplate.clone();
    scene.add(roadPool[slot].cityClone);
  }
  if(roadPool[slot].cityClone){
    // offset city buildings to sides
    roadPool[slot].cityClone.position.set(0,0,zPos);
    roadPool[slot].cityClone.rotation.y = Math.PI; // face inward
  }

  // markings
  if(markingPool[slot]){ scene.remove(markingPool[slot]); }
  markingPool[slot]=makeRoadMarkings(zPos);

  // street lights
  makeStreetLight( 9,.0,zPos+20);
  makeStreetLight(-9,.0,zPos+20);
  makeStreetLight( 9,.0,zPos-10);
  makeStreetLight(-9,.0,zPos-10);
}

// ── Load GLB files ────────────────────────────────────────────────────────────
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

setProgress(0.05);

// ── Wheel nodes (identified from GLB inspection) ──────────────────────────────
// Positions from node data: FL[-0.944,0.453,-0.982] FR[0.944,0.453,-0.982]
//                           RL[-0.826,0.453,1.603]  RR[0.826,0.453,1.603]
const WHEEL_NODE_NAMES = ['Circle.038_1','Circle.050_51','Circle.037_2','Circle.051_37','Circle.048_52'];
let wheelNodes = [];

// Exhaust particles
let exhaustParticles = null;
let exhaustPositions, exhaustVelocities, exhaustLife, PARTICLE_COUNT=80;

function buildExhaust(){
  const geo=new THREE.BufferGeometry();
  exhaustPositions = new Float32Array(PARTICLE_COUNT*3);
  exhaustVelocities= new Float32Array(PARTICLE_COUNT*3);
  exhaustLife      = new Float32Array(PARTICLE_COUNT);
  geo.setAttribute('position',new THREE.BufferAttribute(exhaustPositions,3));
  const mat=new THREE.PointsMaterial({
    color:0xff8800, size:0.18, transparent:true, opacity:0.7,
    depthWrite:false, sizeAttenuation:true
  });
  exhaustParticles=new THREE.Points(geo,mat);
  scene.add(exhaustParticles);
}

// Skid mark decals
const skidMat = new THREE.MeshBasicMaterial({color:0x111111,transparent:true,opacity:.55,depthWrite:false});
const skidMarks=[];

function addSkidMark(x,z){
  if(skidMarks.length>60){ const old=skidMarks.shift(); scene.remove(old); }
  const m=new THREE.Mesh(new THREE.PlaneGeometry(.4,1.2),skidMat.clone());
  m.rotation.x=-Math.PI/2; m.position.set(x,.005,z); scene.add(m); skidMarks.push(m);
}

// ── Load car ──────────────────────────────────────────────────────────────────
let carModel=null, carGroup=new THREE.Group();
scene.add(carGroup);

loader.load('./car.glb', gltf=>{
  carModel=gltf.scene;
  carModel.scale.set(1,1,1);
  carModel.traverse(n=>{
    if(n.isMesh){
      n.castShadow=true; n.receiveShadow=true;
      // enable shadows on all parts
    }
    if(WHEEL_NODE_NAMES.includes(n.name)) wheelNodes.push(n);
  });
  carGroup.add(carModel);
  setProgress(0.55);
  loadCity();
}, xhr=>{ setProgress(0.05 + (xhr.loaded/xhr.total)*0.45); },
   err=>{ console.warn('car.glb not found, using box fallback',err); buildBoxCar(); setProgress(0.55); loadCity(); }
);

function buildBoxCar(){
  const b=new THREE.Mesh(new THREE.BoxGeometry(2,0.8,4.2),
    new THREE.MeshLambertMaterial({color:0xdddddd}));
  b.position.y=0.4; b.castShadow=true; carGroup.add(b);
  // fallback wheels
  const wg=new THREE.CylinderGeometry(.38,.38,.35,14);
  const wm=new THREE.MeshLambertMaterial({color:0x111111});
  [[-1,.38,-1.2],[1,.38,-1.2],[-1,.38,1.2],[1,.38,1.2]].forEach(p=>{
    const w=new THREE.Mesh(wg,wm); w.rotation.z=Math.PI/2;
    w.position.set(...p); carGroup.add(w); wheelNodes.push(w);
  });
}

function loadCity(){
  loader.load('./road.glb', gltf=>{
    // Scale city down — Sketchfab models are often huge
    const box=new THREE.Box3().setFromObject(gltf.scene);
    const size=new THREE.Vector3(); box.getSize(size);
    const maxDim=Math.max(size.x,size.z);
    const targetWidth=80; // fit ~80 units wide on each side
    const scale=targetWidth/maxDim;
    gltf.scene.scale.setScalar(scale);
    // translate so bottom at y=0
    const min=new THREE.Vector3(); box.getMin(min);
    gltf.scene.position.y=-min.y*scale;
    gltf.scene.traverse(n=>{ if(n.isMesh){ n.castShadow=true; n.receiveShadow=true; } });
    cityTemplate=gltf.scene;
    setProgress(0.95);
    initRoad();
    buildExhaust();
    finishLoading();
  }, xhr=>{ setProgress(0.55+(xhr.loaded/xhr.total)*0.4); },
     err=>{ console.warn('road.glb not found, using box city',err); buildBoxCity(); initRoad(); buildExhaust(); finishLoading(); }
  );
}

function buildBoxCity(){
  // Procedural city buildings on both sides
  const bMats=[0x223344,0x332233,0x334422,0x443322,0x222233].map(c=>new THREE.MeshLambertMaterial({color:c}));
  const city=new THREE.Group();
  for(let i=0;i<40;i++){
    const h=8+Math.random()*24;
    const w=4+Math.random()*8;
    const d=4+Math.random()*8;
    const x=(Math.random()>.5?1:-1)*(12+Math.random()*20);
    const z=-200+i*10;
    const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),bMats[i%bMats.length]);
    b.position.set(x,h/2,z); b.castShadow=true; city.add(b);
    // window glow
    const wg=new THREE.Mesh(new THREE.PlaneGeometry(w*.8,h*.7),
      new THREE.MeshBasicMaterial({color:0xffee88,opacity:.3,transparent:true}));
    wg.rotation.y=x>0?Math.PI:0; wg.position.set(x+(x>0?-w/2-.01:w/2+.01),h/2,z); city.add(wg);
  }
  cityTemplate=city;
}

function initRoad(){
  for(let i=0;i<ROAD_COUNT;i++){
    placeRoadSegment(i, -i*ROAD_LENGTH);
  }
}

function finishLoading(){
  setProgress(1);
  setTimeout(()=>{
    document.getElementById('loading').style.display='none';
    gameStarted=true;
  },400);
}

// ── Input ─────────────────────────────────────────────────────────────────────
const keys=new Set();
document.addEventListener('keydown',e=>{ keys.add(e.code);
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
document.addEventListener('keyup',e=>keys.delete(e.code));

function bindTB(id,code){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{ keys.add(code); el.classList.add('on'); e.preventDefault(); },{passive:false});
  el.addEventListener('touchend',  e=>{ keys.delete(code); el.classList.remove('on'); e.preventDefault(); },{passive:false});
  el.addEventListener('touchcancel',()=>{ keys.delete(code); el.classList.remove('on'); });
}
bindTB('tb-left','KeyA'); bindTB('tb-right','KeyD');
bindTB('tb-accel','KeyW'); bindTB('tb-brake','KeyS');
bindTB('tb-nitro','Space');

// ── Physics state ─────────────────────────────────────────────────────────────
let gameStarted=false;
let speed=0, carX=0, carZ=0, carY=0;
let heading=0;          // yaw in radians (0=facing -Z)
let nitroLeft=0, nitroCool=0;
let totalDist=0;
let health=1.0;         // 0=wrecked 1=pristine
let isSkidding=false;

const MAX_SPEED = 28;   // m/s ≈ 100 km/h
const NITRO_SPD = 50;
const ACCEL     = 14;
const BRAKE_F   = 24;
const FRICTION  = 9;
const STEER_SPD = 2.2;
const NITRO_DUR = 3;
const ROAD_HALF = 6;    // half-width of driveable zone

// Gear thresholds (km/h)
const GEARS=[0,20,45,75,110,160,200];
function getGear(kmh){
  for(let i=GEARS.length-1;i>=0;i--) if(kmh>=GEARS[i]) return i;
  return 0;
}

// ── Speedo canvas ─────────────────────────────────────────────────────────────
const sCtx=document.getElementById('speedo').getContext('2d');
function drawSpeedo(kmh){
  const W=110,cx=55,cy=60,r=44;
  sCtx.clearRect(0,0,W,W);
  // arc bg
  sCtx.beginPath(); sCtx.arc(cx,cy,r,Math.PI*.75,Math.PI*2.25);
  sCtx.strokeStyle='#222'; sCtx.lineWidth=8; sCtx.stroke();
  // arc fill
  const pct=Math.min(kmh/220,1);
  sCtx.beginPath(); sCtx.arc(cx,cy,r,Math.PI*.75,Math.PI*.75+pct*Math.PI*1.5);
  const g=sCtx.createLinearGradient(cx-r,cy,cx+r,cy);
  g.addColorStop(0,'#22cc44'); g.addColorStop(.6,'#e8c840'); g.addColorStop(1,'#ff3300');
  sCtx.strokeStyle=g; sCtx.lineWidth=8; sCtx.stroke();
  // number
  sCtx.fillStyle='#fff'; sCtx.font='bold 18px Arial';
  sCtx.textAlign='center'; sCtx.fillText(Math.round(kmh),cx,cy+6);
  sCtx.font='9px Arial'; sCtx.fillStyle='#888'; sCtx.fillText('km/h',cx,cy+18);
}

// ── Update exhaust particles ───────────────────────────────────────────────────
function tickExhaust(dt, accel, nitro){
  if(!exhaustParticles) return;
  const pos=exhaustParticles.geometry.attributes.position;
  for(let i=0;i<PARTICLE_COUNT;i++){
    exhaustLife[i]-=dt;
    if(exhaustLife[i]<=0){
      // respawn at exhaust pipe (~rear of car)
      const ex=carX, ez=carZ+1.5, ey=carY+0.3;
      exhaustPositions[i*3]  =ex+(Math.random()-.5)*.3;
      exhaustPositions[i*3+1]=ey+Math.random()*.2;
      exhaustPositions[i*3+2]=ez+(Math.random()-.5)*.3;
      exhaustVelocities[i*3]  =(Math.random()-.5)*.5;
      exhaustVelocities[i*3+1]=0.4+Math.random()*.6;
      exhaustVelocities[i*3+2]=speed*.05+.5;
      exhaustLife[i]=0.4+Math.random()*.4;
    } else {
      exhaustPositions[i*3]  +=exhaustVelocities[i*3]*dt;
      exhaustPositions[i*3+1]+=exhaustVelocities[i*3+1]*dt;
      exhaustPositions[i*3+2]+=exhaustVelocities[i*3+2]*dt;
    }
  }
  pos.needsUpdate=true;
  exhaustParticles.material.color.set(nitro?0x00aaff:accel?0xff6600:0x888888);
  exhaustParticles.material.opacity=accel||nitro?0.7:0.3;
}

// ── Road recycling ────────────────────────────────────────────────────────────
let farthestZ=0; // most negative Z placed so far

function recycleRoad(){
  // find the segment furthest behind the car and move it ahead
  let behindSlot=-1, behindZ=Infinity;
  for(let i=0;i<ROAD_COUNT;i++){
    const segZ=roadPool[i].z;
    if(segZ > carZ+ROAD_LENGTH*1.5 && segZ < behindZ){ behindZ=segZ; behindSlot=i; }
  }
  if(behindSlot>=0){
    // find current front z
    let frontZ=-Infinity;
    for(let i=0;i<ROAD_COUNT;i++) if(roadPool[i].z<frontZ || frontZ===-Infinity) frontZ=roadPool[i].z;
    const newZ=frontZ-ROAD_LENGTH;
    placeRoadSegment(behindSlot,newZ);
  }
}

// ── Camera lerp state ─────────────────────────────────────────────────────────
let camPos=new THREE.Vector3(0,3,10);
let camLook=new THREE.Vector3(0,1,0);

// ── Main game loop ────────────────────────────────────────────────────────────
const clock=new THREE.Clock();
let lastFrame=0;

function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  now/=1000;

  if(!gameStarted){ renderer.render(scene,camera); return; }

  // ── Input
  const accel = keys.has('KeyW')||keys.has('ArrowUp');
  const braking= keys.has('KeyS')||keys.has('ArrowDown');
  const left   = keys.has('KeyA')||keys.has('ArrowLeft');
  const right  = keys.has('KeyD')||keys.has('ArrowRight');
  const nitroK = keys.has('Space');

  // Nitro
  if(nitroK && nitroLeft<=0 && nitroCool<=0){ nitroLeft=NITRO_DUR; nitroCool=10; }
  if(nitroLeft>0) nitroLeft-=dt;
  if(nitroCool>0) nitroCool-=dt;
  const isNitro=nitroLeft>0;
  document.getElementById('nitro-flash').style.opacity=isNitro?'1':'0';
  document.getElementById('h-nitro').textContent=isNitro?`🔥 NITRO ${nitroLeft.toFixed(1)}s`:nitroCool>0?`⏳ cooldown ${nitroCool.toFixed(0)}s`:'NITRO READY 🚀';

  // Speed
  const topSpd=isNitro?NITRO_SPD:MAX_SPEED;
  if(accel)  speed=Math.min(speed+ACCEL*dt,topSpd);
  else if(braking) speed=Math.max(speed-BRAKE_F*dt,-8);
  else        speed=speed>0?Math.max(speed-FRICTION*dt,0):Math.min(speed+FRICTION*dt,0);

  // Steer — more responsive at lower speed
  if(Math.abs(speed)>0.5){
    const sm=STEER_SPD*(Math.min(Math.abs(speed),MAX_SPEED)/MAX_SPEED)*dt;
    if(left)  heading+=sm;
    if(right) heading-=sm;
  }

  // Move car
  carX+=Math.sin(heading)*speed*dt;
  carZ-=Math.cos(heading)*speed*dt;

  // Road boundary — bounce
  if(Math.abs(carX)>ROAD_HALF){
    carX=Math.sign(carX)*ROAD_HALF;
    health=Math.max(0,health-0.015);
    speed*=0.5;
  }

  totalDist+=Math.abs(speed*dt);

  // Skid marks when turning hard + fast
  isSkidding=(Math.abs(speed)>10 && (left||right));
  if(isSkidding && Math.random()<.3){
    addSkidMark(carX+(Math.random()-.5)*.8, carZ+(Math.random()-.5)*.4);
  }

  // ── Update car mesh
  carGroup.position.set(carX,carY,carZ);
  carGroup.rotation.y=heading;
  // lean into turns
  const leanTarget=(left?1:right?-1:0)*0.06;
  carGroup.rotation.z+=(leanTarget-carGroup.rotation.z)*.15;

  // ── Wheel spin
  const spinDelta=speed*dt*2.5;
  wheelNodes.forEach((w,i)=>{
    // x-axis spin for all, y-axis steer for front (indices 0,1)
    w.rotation.x+=spinDelta;
    if(i<2){
      const steerAngle=(left?.35:right?-.35:0);
      w.rotation.y+=(steerAngle-w.rotation.y)*.2;
    }
  });

  // ── Exhaust
  tickExhaust(dt,accel,isNitro);

  // ── Road recycling
  recycleRoad();

  // ── Camera
  const behindDist=isNitro?7.5:6;
  const upDist=isNitro?3.2:2.8;
  const tCamX=carX-Math.sin(heading)*behindDist;
  const tCamZ=carZ+Math.cos(heading)*behindDist;
  camPos.lerp(new THREE.Vector3(tCamX,carY+upDist,tCamZ),.12);
  camLook.lerp(new THREE.Vector3(carX,carY+.8,carZ),.18);
  camera.position.copy(camPos);
  camera.lookAt(camLook);

  // Camera shake at high speed / nitro
  if(isNitro||speed>20){
    const sh=isNitro?.06:.02;
    camera.position.x+=(Math.random()-.5)*sh;
    camera.position.y+=(Math.random()-.5)*sh*.5;
  }

  // ── HUD
  const kmh=Math.abs(speed)*3.6;
  document.getElementById('h-spd').innerHTML=`${Math.round(kmh)} <span style="font-size:13px;color:#888">km/h</span>`;
  document.getElementById('h-dist').textContent=totalDist>1000?`${(totalDist/1000).toFixed(2)} km`:`${Math.round(totalDist)} m`;
  document.getElementById('h-gear').textContent=speed<0.5?'N':getGear(kmh);
  document.getElementById('dmg-fill').style.width=(health*100)+'%';
  drawSpeedo(kmh);

  renderer.render(scene,camera);
}

requestAnimationFrame(animate);
</script>
